pretrained_model: "stable-diffusion-v1-5/stable-diffusion-v1-5"
clip_model: "openai/clip-vit-base-patch32"
seeds: [0, 1, 2]            # mêmes graines pour tous les modèles (comparaison appariée)
num_inference_steps: 25
guidance_scale: 7.5
lora_scale: 1.0
negative_prompt: "blurry, low quality, text, watermark"
outputs_dir: "outputs"      # où chercher outputs/<run>/checkpoint-<pas>
results_dir: "results"
memorization_threshold: 0.90   # similarité CLIP image-image au-dessus de laquelle on suspecte une copie
grid_seed: 0
